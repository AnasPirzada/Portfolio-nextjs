<svg width="140" height="400" viewBox="0 0 140 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGradientR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#efc041"/>
      <stop offset="50%" stop-color="#eeba2c"/>
      <stop offset="100%" stop-color="#d4a429"/>
    </linearGradient>
    <filter id="glowR" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <g opacity="0.7">
    <!-- Main flowing curve (mirrored) -->
    <path 
      d="M160 0 C110 60, 60 80, 80 140 C100 200, 130 220, 110 280 C90 340, 120 380, 150 400" 
      stroke="url(#goldGradientR)" 
      stroke-width="2" 
      stroke-linecap="round"
      fill="none"
      filter="url(#glowR)">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4s" repeatCount="indefinite"/>
    </path>
    
    <!-- Secondary curve -->
    <path 
      d="M170 40 C120 90, 70 100, 90 160 C110 220, 140 250, 120 310" 
      stroke="url(#goldGradientR)" 
      stroke-width="1.5" 
      stroke-linecap="round"
      fill="none"
      opacity="0.6">
      <animate attributeName="opacity" values="0.4;0.7;0.4" dur="5s" repeatCount="indefinite"/>
    </path>
    
    <!-- Accent curve -->
    <path 
      d="M140 80 C100 110, 80 130, 95 180 C110 230, 125 260, 115 320" 
      stroke="url(#goldGradientR)" 
      stroke-width="1" 
      stroke-linecap="round"
      fill="none"
      opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="6s" repeatCount="indefinite"/>
    </path>
    
    <!-- Decorative circles -->
    <circle cx="85" cy="140" r="8" stroke="url(#goldGradientR)" stroke-width="1.5" fill="none" opacity="0.6">
      <animate attributeName="r" values="8;10;8" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.7;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="110" cy="280" r="6" stroke="url(#goldGradientR)" stroke-width="1" fill="none" opacity="0.5">
      <animate attributeName="r" values="6;8;6" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Small dots -->
    <circle cx="70" cy="100" r="2" fill="#efc041" opacity="0.7">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="115" cy="200" r="2" fill="#eeba2c" opacity="0.6">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="95" cy="340" r="2" fill="#efc041" opacity="0.7">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>